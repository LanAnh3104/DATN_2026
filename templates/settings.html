{% extends 'base.html' %}

{% block title %}Cấu Hình Hệ Thống - NexusAI{% endblock %}

{% block content %}
<div class="space-y-6 max-w-2xl">
    <div>
        <h2 class="text-xl font-bold text-white flex items-center gap-2">
            <i data-lucide="settings" class="w-5 h-5 text-purple-400"></i>
            Module 7: Cấu Hình Môi Trường & API Key
        </h2>
        <p class="text-xs text-gray-400 mt-1">Thông số hoạt động của Python, Playwright Engine và Google Gemini AI</p>
    </div>

    <div class="glass-panel p-6 rounded-2xl border border-gray-800 space-y-4">
        <div>
            <label class="block text-xs text-gray-400 mb-1">Môi trường thực thi (Framework)</label>
            <input type="text" readonly value="Python 3.12 + Django 5.1 (Monolithic Template)" 
                   class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-xs text-purple-300 font-mono">
        </div>

        <div>
            <label class="block text-xs text-gray-400 mb-1">Trình duyệt Automation</label>
            <input type="text" readonly value="Playwright Python Headless Chromium" 
                   class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-xs text-emerald-400 font-mono">
        </div>

        <div>
            <label class="block text-xs text-gray-400 mb-1">Mô hình AI sử dụng</label>
            <input type="text" readonly value="Google Gemini 2.5 Flash / 1.5 Flash" 
                   class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-xs text-blue-400 font-mono">
        </div>

        <div>
            <label class="block text-xs text-gray-400 mb-1">Cơ sở dữ liệu (Database)</label>
            <input type="text" readonly value="SQLite 3 (Django ORM Default) - Sẵn sàng chuyển tiếp PostgreSQL/MySQL" 
                   class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-xs text-amber-300 font-mono">
        </div>
    </div>
</div>
{% endblock %}
